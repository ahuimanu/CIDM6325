{% extends 'blog/base.html' %}
{% block content %}
<h1 class="h3 mb-3">Posts</h1>
<ul class="list-group">
  {% for p in posts %}
    <li class="list-group-item">
      <div class="d-flex align-items-start gap-3">
        {% if p.image %}
          <img src="{{ p.image.url }}" alt="Image for {{ p.title }}" style="width:120px;height:90px;object-fit:cover;border-radius:8px;">
        {% endif %}
        <div class="flex-grow-1">
          <a href="{% url 'blog:post_detail' p.pk %}" class="fw-semibold text-decoration-none">{{ p.title }}</a>
          <div class="small text-muted">By {{ p.author }} • {{ p.created_at|date:"Y-m-d H:i" }} • {{ p.category }}</div>
        </div>
      </div>
    </li>
  {% empty %}
    <li class="list-group-item">No posts yet.</li>
  {% endfor %}
</ul>
{% endblock %}
