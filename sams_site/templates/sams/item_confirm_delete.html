{% extends "base.html" %}

{% block content %}
  <h1>Delete {{ object.title }}</h1>
  <p>Are you sure you want to delete this item?</p>
  <form method="post">{% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'sams:item_detail' pk=object.pk %}">Cancel</a>
  </form>
{% endblock %}
