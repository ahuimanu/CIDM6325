{% extends "base.html" %}

{% block content %}
  <p><a href="{% url 'blog:post_list' %}">← Back</a></p>

  <h1>
    {% if object %}
      Edit: {{ object.title }}
    {% else %}
      New Post
    {% endif %}
  </h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
      {% if object %}Save{% else %}Create{% endif %}
    </button>
  </form>
{% endblock %}
