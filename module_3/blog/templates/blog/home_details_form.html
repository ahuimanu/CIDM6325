<!DOCTYPE html>
<html>
<head>
    <title>Home Details Form</title>
    <style>
        header {
            background-color: lightblue;
            color: white;
            padding: 10px;
        }
        header nav {
            text-align: left;
        }
        .success-message {
            color: lightgreen;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a> |
            <a href="/home-details-list/">View Home Details</a>
        </nav>
    </header>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li class="success-message">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <h1>Enter Home Details</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
</body>
</html>
