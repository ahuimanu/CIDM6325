[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics_app"
version = "0.1.0"
description = "A Django logistics platform refactored with Class-Based Views, HTMX, and validation best practices."
authors = [
    { name="Mafruha Chowdhury", email="maf@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2",
    "django-htmx>=1.14",
    "django-crispy-forms>=2.1",
    "pytest>=8.0",
    "pytest-django>=4.7",
    "sqlparse",
    "tzdata"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "logistics_project.settings"
python_files = ["test_*.py"]

[tool.isort]
profile = "black"

[tool.mypy]
django_settings_module = "logistics_project.settings"
plugins = ["mypy_django_plugin.main"]
